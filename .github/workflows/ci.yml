name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint (flake8)
        run: flake8 src tests --show-source --statistics

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK / PyGObject runtime + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo \
            libgirepository1.0-dev gir1.2-gtk-3.0 gettext
      - name: Build translation catalogs
        run: python3 tools/gen_po.py
      - name: Run tests (core, no display)
        env:
          PYTHONPATH: src
          GDK_BACKEND: x11
        run: python3 -m unittest discover -s tests -v

  # Compile-check that the shipped UI description and Python are valid.
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile all sources
        run: python3 -m compileall -q src tests tools
      - name: Validate Glade UI (GtkBuilder parse)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0
          python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "3.0")
          from gi.repository import Gtk
          b = Gtk.Builder()
          b.add_from_file("src/ribbonfm/resources/ui/mainwindow.glade")
          print("glade OK")
          PY
