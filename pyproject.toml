[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ribbonfm"
version = "0.1.0"
description = "A cross-platform Ribbon-style file manager built with PyGObject (GTK3)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "RibbonFM contributors" }]
requires-python = ">=3.8"
keywords = ["file-manager", "gtk3", "pygobject", "ribbon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]

# PyGObject is normally installed from the distribution package (python3-gi).
# Declaring it helps pip-based installs on systems that provide it on PyPI.
dependencies = ["PyGObject>=3.40"]

[project.scripts]
ribbonfm = "ribbonfm.app:main"

[project.urls]
Homepage = "https://github.com/ysnx64523/Ribbon-File-Manager"
# The Ribbon concept mirrors the upstream PyQtRibbon project but this is an
# independent GTK3 implementation.

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ribbonfm = ["resources/ui/*.glade", "resources/css/*.css",
            "resources/locale/*/LC_MESSAGES/*.mo"]
